<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SATYA STORE | Luxury Lifestyle & Tech</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #6366f1;
      --accent-dark: #4f46e5;
      --gold: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }

    /* Top Offer Strip */
    .promo-bar {
      background: linear-gradient(90deg, #4f46e5, #9333ea, #ec4899);
      color: white;
      text-align: center;
      padding: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Glassmorphism Navbar */
    header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 1rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px; color: var(--primary); }
    .logo span { color: var(--accent); }
    
    .search-box {
      flex: 1;
      max-width: 400px;
      position: relative;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      border-radius: 99px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      outline: none;
      transition: 0.2s;
    }
    .search-box input:focus { background: #fff; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }

    .cart-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.65rem 1.3rem;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.25s;
      box-shadow: 0 4px 12px rgba(15,23,42,0.2);
    }
    .cart-btn:hover { background: var(--accent); transform: translateY(-2px); }

    /* Hero Section */
    .hero {
      background: radial-gradient(circle at top right, #312e81, #0f172a 70%);
      color: white;
      padding: 4.5rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
    }
    .hero-text { max-width: 600px; }
    .hero-badge {
      background: rgba(99, 102, 241, 0.25);
      border: 1px solid rgba(165, 180, 252, 0.4);
      color: #c7d2fe;
      padding: 0.35rem 0.9rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .hero h1 { font-size: 2.8rem; line-height: 1.15; margin-bottom: 1rem; font-weight: 800; }
    .hero p { color: #cbd5e1; font-size: 1.05rem; margin-bottom: 1.8rem; line-height: 1.6; }
    .hero-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 0.9rem 2rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      box-shadow: 0 10px 25px rgba(99,102,241,0.4);
      transition: 0.25s;
    }
    .hero-btn:hover { transform: translateY(-3px); }
    .hero-visual {
      font-size: 7rem;
      background: rgba(255,255,255,0.06);
      padding: 2rem 3rem;
      border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    /* Trust Features */
    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      max-width: 1200px;
      margin: -1.8rem auto 1rem;
      padding: 0 1.5rem;
      position: relative;
      z-index: 10;
    }
    .feat-box {
      background: white;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* Filters */
    .filters {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem 1rem 1rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 0.55rem 1.4rem;
      border: 1px solid #cbd5e1;
      background: white;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
      transition: 0.2s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Product Cards */
    .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.75rem;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .card:hover { transform: translateY(-8px); box-shadow: 0 20px 35px rgba(15,23,42,0.1); }
    .discount-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }
    .wish-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 1rem;
    }
    .card-img-box {
      width: 100%;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 5rem;
      transition: 0.3s;
    }
    .card:hover .card-img-box { transform: scale(1.05); }
    .card-body { padding: 1.3rem; flex: 1; display: flex; flex-direction: column; }
    .meta-row { display: flex; justify-content: space-between; align-items: center; }
    .category-tag { font-size: 0.75rem; text-transform: uppercase; color: var(--accent); font-weight: 800; }
    .rating { font-size: 0.85rem; color: var(--gold); font-weight: 700; }
    .card-title { font-size: 1.15rem; margin: 0.45rem 0; font-weight: 700; color: var(--primary); }
    .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1.1rem; }
    .card-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
    .old-price { font-size: 0.9rem; color: var(--muted); text-decoration: line-through; }
    .add-btn {
      margin-top: auto;
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .add-btn:hover { background: var(--accent); }

    /* Cart Drawer */
    .cart-overlay {
      position: fixed; inset: 0; background: rgba(15,23,42,0.6);
      backdrop-filter: blur(4px);
      display: none; justify-content: flex-end; z-index: 200;
    }
    .cart-overlay.open { display: flex; }
    .cart-drawer {
      background: white; width: 100%; max-width: 400px; height: 100%;
      padding: 1.5rem; display: flex; flex-direction: column;
    }
    .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem; }
    .close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
    .cart-items { flex: 1; overflow-y: auto; padding: 1rem 0; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; background: #f8fafc; padding: 0.8rem; border-radius: 10px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .qty-btn { background: #e2e8f0; border: none; width: 24px; height: 24px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .remove-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
    .cart-footer { border-top: 1px solid #e2e8f0; padding-top: 1rem; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; margin-bottom: 1rem; }
    .checkout-btn {
      width: 100%; padding: 0.95rem;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white; border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }

    /* Footer */
    footer {
      background: var(--primary);
      color: #94a3b8;
      text-align: center;
      padding: 2.5rem 1rem;
      margin-top: 4rem;
    }
    footer h3 { color: white; margin-bottom: 0.5rem; }
    @media (max-width: 650px) {
      .hero h1 { font-size: 2rem; }
      .hero-visual { display: none; }
      .search-box { order: 3; max-width: 100%; width: 100%; }
      header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <div class="promo-bar">🎉 GRAND LAUNCH OFFER: Free Express Delivery + Extra 20% OFF Today!</div>

  <header>
    <div class="logo">SATYA STORE<span>.</span></div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search watches, headphones, lamps..." onkeyup="searchProducts()" />
    </div>
    <button class="cart-btn" onclick="toggleCart()">🛒 Cart (<span id="cart-count">0</span>)</button>
  </header>

  <section class="hero">
    <div class="hero-text">
        <div class="filters" id="products">
    <button class="filter-btn active" onclick="filterProducts('all', this)">All Products</button>
    <button class="filter-btn" onclick="filterProducts('tech', this)">🎧 Tech</button>
    <button class="filter-btn" onclick="filterProducts('fashion', this)">⌚ Fashion</button>
    <button class="filter-btn" onclick="filterProducts('home', this)">🛋️ Home</button>
  </div>

  <main class="container">
    <div class="grid" id="product-grid"></div>
  </main>

  <div class="cart-overlay" id="cart-overlay">
    <div class="cart-drawer">
      <div class="cart-header">
        <h2>Shopping Bag</h2>
        <button class="close-btn" onclick="toggleCart()">&times;</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-footer">
        <div class="total-row"><span>Grand Total:</span><span>₹<span id="cart-total">0</span></span></div>
        <button class="checkout-btn" onclick="checkout()">Place Order Now →</button>
      </div>
    </div>
  </div>

  <footer>
    <h3>SATYA STORE.</h3>
    <p>Premium Quality Products • Pan-India Shipping • 24/7 Customer Support</p>
    <p style="margin-top:1rem; font-size:0.8rem;">© 2026 Satya Store. All Rights Reserved.</p>
  </footer>

  <script>
    const products = [
      { id: 1, name: "Studio ANC Wireless Headphones", category: "tech", price: 12999, oldPrice: 15999, discount: "19% OFF", rating: "4.9", icon: "🎧", bg: "linear-gradient(135deg, #e0e7ff, #c7d2fe)" },
      { id: 2, name: "Royal Chronos Gold Watch", category: "fashion", price: 8499, oldPrice: 10999, discount: "23% OFF", rating: "4.8", icon: "⌚", bg: "linear-gradient(135deg, #fef3c7, #fde68a)" },
      { id: 3, name: "Ambient Smart Touch Lamp", category: "home", price: 3499, oldPrice: 4499, discount: "22% OFF", rating: "4.7", icon: "🛋️", bg: "linear-gradient(135deg, #dcfce7, #bbf7d0)" },
      { id: 4, name: "Pro RGB Mechanical Keyboard", category: "tech", price: 6999, oldPrice: 8999, discount: "22% OFF", rating: "4.9", icon: "⌨️", bg: "linear-gradient(135deg, #f3e8ff, #e9d5ff)" },
      { id: 5, name: "Urban Waterproof Travel Pack", category: "fashion", price: 4299, oldPrice: 5499, discount: "21% OFF", rating: "4.6", icon: "🎒", bg: "linear-gradient(135deg, #ffe4e6, #fecdd3)" },
      { id: 6, name: "Barista Matte Gooseneck Kettle", category: "home", price: 2799, oldPrice: 3499, discount: "20% OFF", rating: "4.8", icon: "☕", bg: "linear-gradient(135deg, #e0f2fe, #bae6fd)" },
      { id: 7, name: "Ultra HD Smart Fitness Band", category: "tech", price: 3999, oldPrice: 4999, discount: "20% OFF", rating: "4.7", icon: "📟", bg: "linear-gradient(135deg, #ccfbf1, #99f6e4)" },
      { id: 8, name: "Classic Polarized Aviators", category: "fashion", price: 2499, oldPrice: 3299, discount: "24% OFF", rating: "4.8", icon: "🕶️", bg: "linear-gradient(135deg, #fae8ff, #f5d0fe)" }
    ];

    let cart = [];

    function renderProducts(list) {
      const grid = document.getElementById("product-grid");
      if (!list.length) {
        grid.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:2rem; color:#64748b;'>No products matched your search.</p>";
        return;
      }
      grid.innerHTML = list.map(p => `
        <div class="card">
          <span class="discount-badge">${p.discount}</span>
          <button class="wish-btn" onclick="this.innerText = this.innerText === '🤍' ? '❤️' : '🤍'">🤍</button>
          <div class="card-img-box" style="background:${p.bg}">${p.icon}</div>
          <div class="card-body">
            <div class="meta-row">
              <span class="category-tag">${p.category}</span>
              <span class="rating">⭐ ${p.rating}</span>
            </div>
            <h3 class="card-title">${p.name}</h3>
            <div class="price-row">
              <span class="card-price">₹${p.price.toLocaleString()}</span>
              <span class="old-price">₹${p.oldPrice.toLocaleString()}</span>
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">+ Add to Bag</button>
          </div>
        </div>
      `).join("");
    }

    function filterProducts(cat, btn) {
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("search-input").value = "";
      renderProducts(cat === "all" ? products : products.filter(p => p.category === cat));
    }

    function searchProducts() {
      const q = document.getElementById("search-input").value.toLowerCase();
      renderProducts(products.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)));
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) { existing.qty += 1; } else { cart.push({ ...products.find(p => p.id === id), qty: 1 }); }
      updateCart();
    }

    function changeQty(idx, delta) {
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCart();
    }

    function updateCart() {
      document.getElementById("cart-count").innerText = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById("cart-items").innerHTML = cart.length === 0
        ? "<p style='text-align:center; color:#64748b; margin-top:2rem;'>Your shopping bag is empty.</p>"
        : cart.map((item, i) => `
            <div class="cart-item">
              <div>
                <strong>${item.icon} ${item.name}</strong><br>
                <small style="color:#4f46e5; font-weight:700;">₹${(item.price * item.qty).toLocaleString()}</small>
                <div class="qty-controls">
                  <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
                  <span>${item.qty}</span>
                  <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
                </div>
              </div>
              <button class="remove-btn" onclick="changeQty(${i}, -999)">Remove</button>
            </div>
          `).join("");
      document.getElementById("cart-total").innerText = cart.reduce((s, x) => s + (x.price * x.qty), 0).toLocaleString();
    }

    function toggleCart() { document.getElementById("cart-overlay").classList.toggle("open"); }

    function checkout() {
      if (!cart.length) return alert("Your bag is empty!");
      alert("🎉 Order Confirmed at SATYA STORE!\nTotal Payable: ₹" + document.getElementById("cart-total").innerText);
      cart = []; updateCart(); toggleCart();
    }

    renderProducts(products);
  </script>
</body>
</html>
